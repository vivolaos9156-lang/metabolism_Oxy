      "ເພີ່ມການຫາຍໃຈ ແລະ ໄຫຼວຽນ, ການປັບຕົວ ຂອງລະບົບປະສາດອັດຕະໂນມັດ"
    ],
    correct: 1
  }
];

let questions = [], currentIndex = 0, score = 0, answered = false;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function startGame() {
  questions = shuffle([...allQuestions]);
  currentIndex = 0;
  score = 0;
  answered = false;
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('score').textContent = score;
  document.getElementById('total').textContent = questions.length;
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = questions[currentIndex];
  document.getElementById('current').textContent = currentIndex + 1;
  document.getElementById('questionText').textContent = (currentIndex + 1) + ". " + q.q;
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('nextBtn').disabled = true;

  const opts = q.options.map((text, idx) => ({ text, originalIndex: idx }));
  shuffle(opts);

  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt.text;
    btn.dataset.original = opt.originalIndex;
    btn.onclick = () => selectAnswer(btn, opt.originalIndex, q.correct);
    optionsDiv.appendChild(btn);
  });
}

function selectAnswer(btn, selected, correct) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('#options button').forEach(b => {
    b.disabled = true;
    if (parseInt(b.dataset.original) === correct) b.classList.add('correct');
  });
  const feedback = document.getElementById('feedback');
  feedback.classList.remove('hidden', 'correct', 'wrong');
  if (selected === correct) {
    score++;
    document.getElementById('score').textContent = score;
    btn.classList.add('correct');
    feedback.textContent = "✅ ຖືກຕ້ອງ!";
    feedback.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    feedback.textContent = "❌ ຜິດ!";
    feedback.classList.add('wrong');
  }
  document.getElementById('nextBtn').disabled = false;
}

document.getElementById('nextBtn').onclick = () => {
  currentIndex++;
  if (currentIndex < questions.length) {
    showQuestion();
  } else {
    document.getElementById('quizArea').classList.add('hidden');
    document.getElementById('resultArea').classList.remove('hidden');
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalTotal').textContent = questions.length;
    document.getElementById('percent').textContent = `ເປີເຊັນ: ${Math.round((score / questions.length) * 100)}%`;
  }
};

document.getElementById('refreshBtn').onclick = startGame;
startGame();
</script>
</body>
